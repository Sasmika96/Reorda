name: reorda
description: "Reorda - Autonomous AI Supply Chain & Inventory Operations"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Services
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  url_launcher: ^6.2.5
  firebase_messaging: ^14.7.19
  flutter_local_notifications: ^17.0.0

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0

  # Design, Utilities & QR
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.10+1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0
  intl: ^0.19.0
  google_generative_ai: ^0.4.7
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# ⚠️ 'flutter:' කොටස මෙතැන තියෙන්නේ එක වාරයක් පමණි
flutter:
  uses-material-design: true

  assets:
    - .env